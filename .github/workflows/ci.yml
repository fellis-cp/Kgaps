name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."

      - name: Check shell syntax and Python compilation
        run: make lint

      - name: Run unit tests
        run: make test

      - name: Test packaging (.kwinscript)
        run: make package && test -f kgaps-*.kwinscript
